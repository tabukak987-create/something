<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF Bond Investment Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .logo { 
            font-size: 64px; 
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5));
        }
        
        h1 {
            color: #f8fafc;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.025em;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        
        .button-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        button {
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:active { transform: scale(0.98); }
        
        #refreshBtn {
            background: #2563eb;
            color: white;
        }
        
        #refreshBtn:hover { background: #1d4ed8; border-color: #3b82f6; }
        
        #downloadBtn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        #downloadBtn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
        }
        
        #downloadBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .log-panel {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            text-align: left;
            color: #10b981;
            height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .icon { font-size: 22px; }
        
        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        
        .status.success {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            border: 1px solid #28a745;
            display: block;
        }
        
        .status.processing {
            background: linear-gradient(135deg, #cce5ff, #b8daff);
            color: #004085;
            border: 1px solid #007bff;
            display: block;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📊</div>
        <h1>PF-Compliant Bond Investment Agent</h1>
        <p class="subtitle">
            Information Memorandum (IM) Based • ISIN Tagged<br>
            Labour Ministry Aligned • Daily Refreshed
        </p>
        
        <div class="button-container">
            <button id="refreshBtn" onclick="refreshAnalysis()">
                <span class="icon">🔄</span>
                <span id="refreshText">Refresh</span>
            </button>
            
            <button id="downloadBtn" onclick="downloadReport()" disabled>
                <span class="icon">📥</span>
                <span>Download PDF Report</span>
            </button>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        let reportReady = false;
        
        async function refreshAnalysis() {
            const btn = document.getElementById('refreshBtn');
            const status = document.getElementById('status');
            const refreshText = document.getElementById('refreshText');
            const downloadBtn = document.getElementById('downloadBtn');
            
            btn.disabled = true;
            refreshText.innerHTML = '<span class="spinner"></span> Analyzing...';
            status.className = 'status processing';
            status.textContent = '📄 Analyzing Information Memoranda (IM) with PF compliance...';
            status.style.display = 'block';
            
            try {
                const response = await fetch('/refresh', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    reportReady = true;
                    downloadBtn.disabled = false;
                    status.className = 'status success';
                    status.innerHTML = `✅ Analysis Complete (IM-Based)!<br>
                        📈 ${data.recommendations} bonds recommended<br>
                        🟢 Low Risk: ${data.low_risk} | 🟡 Medium Risk: ${data.medium_risk}<br>
                        📅 ${data.date}`;
                } else {
                    status.className = 'status';
                    status.style.background = '#f8d7da';
                    status.style.color = '#721c24';
                    status.style.border = '1px solid #f5c6cb';
                    status.style.display = 'block';
                    status.textContent = '❌ Error: ' + data.error;
                }
            } catch (error) {
                status.className = 'status';
                status.style.background = '#f8d7da';
                status.style.color = '#721c24';
                status.style.border = '1px solid #f5c6cb';
                status.style.display = 'block';
                status.textContent = '❌ Connection error: ' + error.message;
            }
            
            btn.disabled = false;
            refreshText.textContent = 'Refresh';
        }
        
        function downloadReport() {
            if (reportReady) {
                window.location.href = '/download-report';
            }
        }
        
        fetch('/status')
            .then(r => r.json())
            .then(data => {
                if (data.report_ready) {
                    document.getElementById('downloadBtn').disabled = false;
                    reportReady = true;
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
