# ══════════════════════════════════════════════════════════════════════
# PF Trust Investment Engine — Docker Compose Stack
# Updated: Feb 2026
#
# NOTE: PostgreSQL 18 is installed LOCALLY on Windows at localhost:5432
#       (not in Docker). The compliance_engine connects to the host DB.
#
# Services (containerized):
#   gateway         — Unified FastAPI Gateway (port 9000)
#   compliance      — Compliance Engine (port 8100) → uses host PostgreSQL
#   bond_intel      — Bond Intelligence (port 8500)
#   bond_quotes     — Bond Quote System (port 8000)
#   inst_fis        — Institutional FIS (port 8600)
#   investment_eng  — Investment Decision Engine (port 8900)
#   redis           — Redis 7 cache / pub-sub
#   pgadmin         — DB admin UI (port 5050) — optional, use --profile tools
#
# Usage:
#   docker compose up -d                          # full stack
#   docker compose up gateway compliance          # minimal
#   docker compose --profile tools up             # + pgadmin
#   docker compose --profile monitoring up        # + prometheus + grafana
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  bond_net:
    driver: bridge

volumes:
  redis_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

# ── Host DB connection for Windows (host.docker.internal → 127.0.0.1 on host)
# SECURITY: DB credentials injected from environment / secrets manager — NEVER hardcoded
x-host-db: &host-db
  COMPLIANCE_DB_URL: ${COMPLIANCE_DB_URL:?COMPLIANCE_DB_URL must be set via vault or environment}
  DATABASE_URL: ${COMPLIANCE_DB_URL:?COMPLIANCE_DB_URL must be set via vault or environment}

# ── Shared application base ────────────────────────────────────────────
x-app-base: &app-base
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  networks: [bond_net]
  restart: unless-stopped
  environment:
    LOG_JSON: "1"
    LOG_LEVEL: INFO
    PYTHONPATH: /app
  # ── Deployment Hardening (P1B) ──
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1024M
      reservations:
        cpus: "0.25"
        memory: 256M

services:
  # ── Redis 7 ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bond_redis
    networks: [bond_net]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes
      --maxmemory 512mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 600M

  # ── Compliance Engine (port 8100) — connects to host PostgreSQL 18 ──
  compliance:
    <<: *app-base
    container_name: bond_compliance
    env_file: [compliance_engine/.env]
    environment:
      <<: *host-db
      PYTHONPATH: /app/Private3
    ports:
      - "127.0.0.1:8100:8100"
    command: >
      sh -c "cd /app/Private3/compliance_engine &&
             uvicorn main:app --host 0.0.0.0 --port 8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Bond Intelligence (port 8500) ─────────────────────────────────
  bond_intel:
    <<: *app-base
    container_name: bond_intelligence
    ports:
      - "127.0.0.1:8500:8500"
    command: >
      sh -c "cd /app/Private3 &&
             python -m uvicorn bond_intelligence.main:app --host 0.0.0.0 --port 8500"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Bond Quote System (port 8000) ─────────────────────────────────
  bond_quotes:
    <<: *app-base
    container_name: bond_quote_system
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "cd /app/Private3 &&
             python -m uvicorn bond_quote_system.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Institutional FIS (port 8600) ─────────────────────────────────
  inst_fis:
    <<: *app-base
    container_name: institutional_fis
    ports:
      - "127.0.0.1:8600:8600"
    command: >
      sh -c "cd /app/Private3 &&
             python -m uvicorn institutional_fis.main:app --host 0.0.0.0 --port 8600"

  # ── Investment Decision Engine (port 8900) ─────────────────────────
  investment_eng:
    <<: *app-base
    container_name: investment_engine
    ports:
      - "127.0.0.1:8900:8900"
    environment:
      BOND_INTELLIGENCE_URL: http://bond_intel:8500
      COMPLIANCE_ENGINE_URL: http://compliance:8100
      BOND_QUOTE_URL:        http://bond_quotes:8000
      INSTITUTIONAL_FIS_URL: http://inst_fis:8600
      UNIFIED_GATEWAY_URL:   http://gateway:9000
    command: >
      sh -c "cd /app/Private3/investment_engine &&
             uvicorn main:app --host 0.0.0.0 --port 8900"
    depends_on:
      compliance:
        condition: service_healthy
      bond_intel:
        condition: service_healthy

  # ── Unified Gateway (port 9000) ─────────────────────────────────────
  gateway:
    <<: *app-base
    container_name: bond_gateway
    env_file: [unified_gateway/.env]
    ports:
      - "9000:9000"
    environment:
      COMPLIANCE_ENGINE_URL: http://compliance:8100
      BOND_INTELLIGENCE_URL: http://bond_intel:8500
      BOND_QUOTE_URL:        http://bond_quotes:8000
      REDIS_URL:             redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      LOG_JSON: "1"
    volumes:
      - ./backend/app/data:/app/backend/app/data
      - ./logs:/app/logs
    command: >
      sh -c "python -m uvicorn backend.main:app --host 0.0.0.0 --port 9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  # ── PgAdmin (optional — use: docker compose --profile tools up) ────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bond_pgadmin
    profiles: ["tools"]
    networks: [bond_net]
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set - min 12 chars}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Prometheus (optional — use: docker compose --profile monitoring up)
  prometheus:
    image: prom/prometheus:latest
    container_name: bond_prometheus
    profiles: ["monitoring"]
    networks: [bond_net]
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  # ── Grafana (optional — use: docker compose --profile monitoring up)
  grafana:
    image: grafana/grafana:latest
    container_name: bond_grafana
    profiles: ["monitoring"]
    networks: [bond_net]
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana_dashboard.json:/var/lib/grafana/dashboards/gateway.json:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set - min 12 chars}
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
    ports:
      - "3000:3000"
    depends_on: [prometheus]
