services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: poi_investment
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Harsh@1234}
    ports:
      - "3306:3306"
    volumes:
      - poi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-Harsh@1234}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/poi_investment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Harsh@1234}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-32-byte-or-longer-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  poi_mysql_data:
