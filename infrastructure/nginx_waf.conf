# ─────────────────────────────────────────────────────────────────────────────
# nginx_waf.conf  —  WAF Rules for PF Trust Platform (M1 Remediation)
# ─────────────────────────────────────────────────────────────────────────────
#
# Include this file in the main nginx.conf inside the http{} block:
#   include /path/to/nginx_waf.conf;
#
# These rules provide application-layer protection without requiring
# ModSecurity (which is complex on Windows). Uses native nginx directives.
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. Geo-blocking: India-only for production ──────────────────────────────
# Uncomment when you want to restrict to Indian IPs only.
# Requires ngx_http_geoip2_module or manual CIDR list.
# geo $block_country {
#     default         1;
#     14.0.0.0/8      0;   # Indian ranges (simplified — use MaxMind GeoIP DB)
#     27.0.0.0/8      0;
#     43.224.0.0/13   0;
#     49.0.0.0/8      0;
#     59.88.0.0/13    0;
#     103.0.0.0/8     0;
#     106.0.0.0/8     0;
#     117.192.0.0/10  0;
#     122.160.0.0/11  0;
#     182.64.0.0/11   0;
#     223.224.0.0/11  0;
#     127.0.0.0/8     0;   # localhost
#     10.0.0.0/8      0;   # private
#     172.16.0.0/12   0;   # private
#     192.168.0.0/16  0;   # private
# }

# ── 2. Request size limits ──────────────────────────────────────────────────
client_max_body_size        10m;     # Max upload/request body
client_body_buffer_size     128k;
client_header_buffer_size   4k;
large_client_header_buffers 4 8k;

# ── 3. Connection-level throttling ──────────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn conn_limit 20;           # Max 20 simultaneous connections per IP
limit_conn_status 429;

# ── 4. Slowloris / slow POST protection ────────────────────────────────────
client_body_timeout   10s;
client_header_timeout 10s;
send_timeout          10s;

# ── 5. Hide server version ─────────────────────────────────────────────────
server_tokens off;

# ── 6. SQL injection / XSS / path traversal blocking ───────────────────────
# Map $request_uri and $args to detect malicious patterns
map $request_uri $block_sql_inject {
    default 0;
    "~*union.*select"            1;
    "~*select.*from"             1;
    "~*insert.*into"             1;
    "~*drop.*table"              1;
    "~*update.*set"              1;
    "~*delete.*from"             1;
    "~*benchmark\("              1;
    "~*sleep\("                  1;
    "~*load_file\("              1;
    "~*into.*outfile"            1;
    "~*0x[0-9a-f]{8,}"          1;
    "~*char\([0-9]"              1;
    "~*concat\("                 1;
    "~*group_concat\("           1;
    "~*information_schema"       1;
    "~*sys\..*tables"            1;
}

map $request_uri $block_xss {
    default 0;
    "~*<script"                  1;
    "~*javascript:"              1;
    "~*vbscript:"                1;
    "~*on(load|error|click|mouseover|focus|blur)=" 1;
    "~*eval\("                   1;
    "~*expression\("             1;
    "~*document\.(cookie|write)" 1;
    "~*window\.location"         1;
    "~*alert\("                  1;
}

map $request_uri $block_traversal {
    default 0;
    "~*\.\./\.\."                1;
    "~*\.\.%2f"                  1;
    "~*%2e%2e"                   1;
    "~*/etc/passwd"              1;
    "~*/etc/shadow"              1;
    "~*/proc/self"               1;
    "~*boot\.ini"                1;
    "~*win\.ini"                 1;
    "~*cmd\.exe"                 1;
    "~*powershell"               1;
}

map $request_uri $block_scanners {
    default 0;
    "~*nikto"                    1;
    "~*sqlmap"                   1;
    "~*w3af"                     1;
    "~*acunetix"                 1;
    "~*nessus"                   1;
    "~*openvas"                  1;
    "~*havij"                    1;
}

map $http_user_agent $block_bad_bots {
    default 0;
    "~*sqlmap"                   1;
    "~*nikto"                    1;
    "~*nmap"                     1;
    "~*masscan"                  1;
    "~*python-requests"          1;
    "~*Go-http-client"           1;
    "~*curl/"                    1;
    ""                           1;       # Block empty user-agents
}

# ── 7. Combined WAF enforcement block (include in server{}) ────────────────
# Add inside your server {} block:
#
#   # WAF enforcement
#   if ($block_sql_inject) { return 403; }
#   if ($block_xss)        { return 403; }
#   if ($block_traversal)  { return 403; }
#   if ($block_scanners)   { return 403; }
#   if ($block_bad_bots)   { return 403; }
#   # Uncomment for geo-blocking:
#   # if ($block_country)  { return 403; }

# ── 8. Additional security headers (supplement main config) ────────────────
add_header Content-Security-Policy       "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy            "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Embedder-Policy  "require-corp" always;
add_header Cross-Origin-Opener-Policy    "same-origin" always;
add_header Cross-Origin-Resource-Policy  "same-origin" always;
