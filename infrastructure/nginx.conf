# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf  —  Reverse Proxy + HTTPS for PF Trust Compliance Engine
# ─────────────────────────────────────────────────────────────────────────────
#
# SETUP INSTRUCTIONS (Windows):
#   1. Download nginx for Windows: https://nginx.org/en/docs/windows.html
#   2. Copy this file to nginx/conf/nginx.conf
#   3. Get a SSL certificate:
#        Self-signed (dev):  openssl req -x509 -nodes -days 3650 -newkey rsa:2048
#                            -keyout ssl/privkey.pem -out ssl/fullchain.pem
#        Production:         Use Let's Encrypt (certbot) or buy a cert
#   4. Put cert files in: nginx/ssl/fullchain.pem & nginx/ssl/privkey.pem
#   5. Start: nginx.exe
#   6. Stop:  nginx.exe -s stop
#
# ─────────────────────────────────────────────────────────────────────────────

worker_processes  2;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # WAF rules — SQL injection, XSS, traversal, bot blocking
    include       nginx_waf.conf;

    # Logging
    access_log  logs/access.log;
    error_log   logs/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"            always;
    add_header X-XSS-Protection         "1; mode=block"         always;
    add_header X-Content-Type-Options   "nosniff"               always;
    add_header Referrer-Policy          "strict-origin"         always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting — protect API against DDoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # ─── HTTP → HTTPS redirect ───────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── Compliance Engine (port 8100) ───────────────────────────────────
    upstream compliance_engine {
        server 127.0.0.1:8100;
        keepalive 32;
    }

    # ─── Bond Intelligence (port 8500) ───────────────────────────────────
    upstream bond_intelligence {
        server 127.0.0.1:8500;
        keepalive 32;
    }

    # ─── Unified Gateway (port 9000) ─────────────────────────────────────
    upstream unified_gateway {
        server 127.0.0.1:9000;
        keepalive 32;
    }
    # ─── Investment Engine (port 8900) ───────────────────────────────────────
    upstream investment_engine {
        server 127.0.0.1:8900;
        keepalive 32;
    }

    # ─── Bond Quote System (port 8000) ───────────────────────────────────────
    upstream bond_quote_system {
        server 127.0.0.1:8000;
        keepalive 32;
    }
    # ─── Main HTTPS server ────────────────────────────────────────────────
    server {
        listen      443 ssl http2;
        server_name localhost;  # Replace with your domain in production

        ssl_certificate      ssl/fullchain.pem;
        ssl_certificate_key  ssl/privkey.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        # WAF enforcement
        if ($block_sql_inject) { return 403; }
        if ($block_xss)        { return 403; }
        if ($block_traversal)  { return 403; }
        if ($block_scanners)   { return 403; }
        if ($block_bad_bots)   { return 403; }

        # ── PF Trust Decision Engine Dashboard ──────────────────────────
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://unified_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Auth endpoint — extra rate limiting ──────────────────────────
        location /auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass         http://unified_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # ── Bond Intelligence API ─────────────────────────────────────────
        location /bond-intel/ {
            limit_req zone=api_limit burst=10 nodelay;
            rewrite ^/bond-intel/(.*)$ /$1 break;
            proxy_pass         http://bond_intelligence;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # ── Unified Gateway ───────────────────────────────────────────────
        location /gateway/ {
            limit_req zone=api_limit burst=10 nodelay;
            rewrite ^/gateway/(.*)$ /$1 break;
            proxy_pass         http://unified_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # ── Block common attack paths ─────────────────────────────────────
        location ~* \.(php|asp|aspx|jsp|cgi)$ { return 404; }
        location ~ /\.env                      { return 404; }
        location ~ /\.git                      { return 404; }
        # ── Investment Engine ──────────────────────────────────────────────────
        location /engine/ {
            limit_req zone=api_limit burst=10 nodelay;
            rewrite ^/engine/(.*)$ /$1 break;
            proxy_pass         http://investment_engine;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }

        # ── Bond Quote System ──────────────────────────────────────────────────
        location /bqs/ {
            limit_req zone=api_limit burst=10 nodelay;
            rewrite ^/bqs/(.*)$ /$1 break;
            proxy_pass         http://unified_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }
        # ── Report downloads ─────────────────────────────────────────────
        location /reports/ {
            proxy_pass         http://unified_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
